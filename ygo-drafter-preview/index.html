<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Preview: YGO Drafter</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Draft Yu-Gi-Oh! decks live with friends: Duelist Kingdom, GOAT or Edison.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐐</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600&family=Saira+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=21">
</head>
<body>
<header class="bar">
  <h1 class="brand"><a href="./">YGO Drafter</a></h1>
  <div class="status" id="status"></div>
  <div class="bar-actions" id="barActions"></div>
  <div class="zoomer" id="zoomer" role="group" aria-label="Zoom"><button type="button" data-zoom="-" aria-label="Zoom out">−</button><button type="button" data-zoom="fit" title="Fit to the window">Fit</button><button type="button" data-zoom="+" aria-label="Zoom in">+</button><output id="zoomVal">100%</output></div>
</header>
<main id="app"><p class="loading">Loading the card pool…</p></main>
<div class="modal" id="poolModal" hidden role="dialog" aria-modal="true" aria-labelledby="poolTitle">
  <div class="sheet">
    <header><h2 id="poolTitle">Card pool</h2><span id="poolCount"></span><button class="ghost" id="poolClose" type="button" style="margin-left:auto">Close</button></header>
    <div class="chips" id="poolChips"></div>
    <div class="pool-body" id="poolBody"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<noscript><p style="padding:24px">YGO Drafter needs JavaScript turned on.</p></noscript>
<script>window.YGO_ASSETS = "/ygo-drafter/";</script>
<script type="module" src="app.js?v=21"></script>
</body>
</html>
