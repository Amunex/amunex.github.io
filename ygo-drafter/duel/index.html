<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>YGO Drafter: Duel test</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐐</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Marcellus+SC&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css?v=18">
<link rel="stylesheet" href="duel.css?v=7">
</head>
<body>
<header class="bar">
  <h1 class="brand"><a href="../">YGO Drafter</a></h1>
  <div class="status" id="status"><span>Duel test, GOAT rules</span></div>
  <div class="bar-actions" id="barActions"></div>
</header>
<main id="app"><p class="loading">Loading the duel engine…</p></main>
<div class="modal" id="picker" hidden role="dialog" aria-modal="true" aria-labelledby="pickTitle">
  <div class="sheet pick-sheet">
    <header><h2 id="pickTitle">Choose</h2><span id="pickCount"></span></header>
    <div class="pick-body" id="pickBody"></div>
    <div class="pick-actions" id="pickActions"></div>
  </div>
</div>
<div class="modal" id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="viewTitle">
  <div class="sheet pick-sheet">
    <header><h2 id="viewTitle">Cards</h2><span id="viewCount"></span><button class="ghost" type="button" data-act="close-viewer">Close</button></header>
    <div class="pick-body" id="viewBody"></div>
  </div>
</div>
<div class="modal" id="info" hidden role="dialog" aria-modal="true" aria-label="Card details">
  <div class="sheet info-sheet"><div class="info-body" id="infoBody"></div><div class="pick-actions"><button class="ghost" type="button" data-act="close-info">Close</button></div></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="duel.js?v=9"></script>
</body>
</html>
