<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YGO Drafter</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Draft GOAT-format Yu-Gi-Oh! decks live with friends.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐐</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Marcellus+SC&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<header class="bar">
  <h1 class="brand"><a href="./">YGO Drafter</a></h1>
  <div class="status" id="status"></div>
  <div class="bar-actions" id="barActions"></div>
</header>
<main id="app"><p class="loading">Loading the card pool…</p></main>
<div class="modal" id="poolModal" hidden role="dialog" aria-modal="true" aria-labelledby="poolTitle">
  <div class="sheet">
    <header><h2 id="poolTitle">Card pool</h2><span id="poolCount"></span><button class="ghost" id="poolClose" type="button" style="margin-left:auto">Close</button></header>
    <div class="chips" id="poolChips"></div>
    <div class="pool-body" id="poolBody"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<noscript><p style="padding:24px">YGO Drafter needs JavaScript turned on.</p></noscript>
<script src="data/pool.js?v=2"></script>
<script src="data/img-1.js?v=2" defer></script>
<script src="data/img-2.js?v=2" defer></script>
<script src="data/img-3.js?v=2" defer></script>
<script src="data/img-4.js?v=2" defer></script>
<script type="module" src="app.js?v=2"></script>
</body>
</html>
