<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Trivia Night</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%230a1fd4'/%3E%3Ctext x='32' y='48' font-family='Impact,Arial Narrow,sans-serif' font-size='44' text-anchor='middle' fill='%23ffc72c'%3E%3F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=Merriweather:wght@700;900&display=swap">
<style>
:root{
  --blue:#0a1fd4;--blue-deep:#06127e;--blue-hi:#2440ff;--gold:#ffc72c;
  --room:#0c1022;--desk:#141933;--desk-2:#1c2244;--desk-3:#252c57;--wire:#2a3262;
  --ink:#e8eaf7;--ink-2:#a1a8cf;--ink-3:#6f77a3;--ok:#36d07f;--bad:#ff5a5f;--onair:#ff3b30;
  --f-num:"Anton",Impact,"Arial Narrow Bold",sans-serif;
  --f-cond:"Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --f-ui:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-clue:"Merriweather",Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--room);color:var(--ink);font:400 15px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hidden{display:none!important}
.grow{flex:1}
.ic{fill:currentColor;flex:none;display:block}
.boot{display:flex;align-items:center;justify-content:center;height:100vh;color:var(--ink-2)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:7px;border:1px solid var(--wire);background:var(--desk-2);color:var(--ink);font-weight:600;font-size:14px;line-height:1;white-space:nowrap;text-decoration:none;transition:background-color .12s,border-color .12s,color .12s}
.btn:hover{background:var(--desk-3);border-color:#3a4486}
.btn:disabled{opacity:.42;cursor:default;pointer-events:none}
.btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:6px}
.btn.big{height:48px;padding:0 22px;font-size:17px}
.btn.wide{width:100%}
.btn.icon{width:36px;padding:0}
.btn.sm.icon{width:30px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--desk-2);color:var(--ink)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#1b1400}
.btn.primary:hover{background:#ffd65c;border-color:#ffd65c}
.btn.ok{background:#11402a;border-color:#1d6a45;color:#c6f6dc}
.btn.ok:hover{background:#175236}
.btn.bad{background:#46171c;border-color:#7b2930;color:#ffd0d2}
.btn.bad:hover{background:#5a1d23}
.btn.danger{color:#ff9ea1}
.kbd{display:inline-block;margin-left:3px;padding:2px 5px;border-radius:4px;border:1px solid currentColor;opacity:.6;font-size:11px;font-weight:600;line-height:1.1}

/* fields */
.txt{width:100%;background:var(--room);border:1px solid var(--wire);border-radius:8px;color:var(--ink);padding:9px 12px;line-height:1.45}
input.txt{height:38px;padding:0 12px}
.txt:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,199,44,.15)}
textarea.txt{resize:vertical;min-height:110px}
.txt.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.txt.tall{min-height:300px}
.txt.short{width:84px}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:13px;font-weight:600;color:var(--ink-2)}
.hint{margin:0;color:var(--ink-2);font-size:13.5px}
.small{font-size:12.5px}
select{background:var(--desk-2);border:1px solid var(--wire);border-radius:6px;height:30px;padding:0 6px;font-size:13px}

/* editor */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 20px;background:rgba(12,16,34,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--wire)}
.brand{font:400 25px/1 var(--f-num);color:var(--gold);text-shadow:2px 2px 0 #000;margin-right:10px;white-space:nowrap}
.game-pick{height:36px;min-width:160px;max-width:280px;padding:0 10px;border-radius:7px;font-size:14px;font-weight:600}
.editor{max-width:1440px;margin:0 auto;padding:26px 20px 90px}
.title-in{width:100%;background:transparent;border:0;border-bottom:2px solid var(--wire);padding:4px 0 8px;font:700 38px/1.15 var(--f-cond);color:#fff}
.title-in:focus{outline:none;border-bottom-color:var(--gold)}
.meta{display:flex;flex-wrap:wrap;gap:6px 22px;margin:12px 0 18px;color:var(--ink-2);font-size:14px}
.meta .err{color:#ffb4b6}
.egrid-wrap{overflow-x:auto;padding-bottom:6px}
.egrid{display:grid;gap:6px;padding:6px;background:#000;border-radius:8px;width:100%;min-width:min-content}
.egrid>*{min-width:0}
.eg-corner{display:flex;align-items:flex-end;justify-content:center;padding:8px;border-radius:4px;background:var(--room);color:var(--ink-3);font-size:12.5px;font-weight:600}
.eg-cat{position:relative;display:flex;align-items:center;min-height:80px;padding:8px 26px 8px 8px;border-radius:3px;background:var(--blue)}
.cat-in{width:100%;height:60px;padding:2px;background:transparent;border:0;resize:none;overflow:hidden;text-align:center;color:#fff;font:700 19px/1.12 var(--f-cond);text-transform:uppercase;text-shadow:2px 2px 0 #000}
.cat-in::placeholder{color:rgba(255,255,255,.45);text-shadow:none}
.cat-in:focus{outline:none;background:rgba(0,0,0,.25);border-radius:4px}
.eg-more{position:absolute;top:4px;right:3px;display:flex;align-items:center;justify-content:center;width:22px;height:22px;border:0;border-radius:4px;background:transparent;color:rgba(255,255,255,.75)}
.eg-more:hover{background:rgba(0,0,0,.35);color:#fff}
.eg-row{position:relative;display:flex;align-items:center;justify-content:center;padding:6px 24px 6px 6px;border-radius:4px;background:var(--room)}
.eg-row .eg-more{color:var(--ink-3)}
.pts-in{width:100%;height:36px;padding:0 4px;text-align:center;background:var(--desk-2);border:1px solid var(--wire);border-radius:6px;color:var(--gold);font:400 20px/1 var(--f-num);-moz-appearance:textfield}
.pts-in::-webkit-inner-spin-button,.pts-in::-webkit-outer-spin-button,.pscore::-webkit-inner-spin-button,.pscore::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.pts-in:focus{outline:none;border-color:var(--gold)}
.ecell{position:relative;display:flex;flex-direction:column;gap:5px;min-height:108px;padding:9px 10px;border:0;border-radius:3px;background:var(--blue);color:#fff;text-align:left;transition:background-color .12s}
.ecell:hover{background:var(--blue-hi)}
.ec-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.ec-pts{font:400 21px/1 var(--f-num);color:var(--gold);text-shadow:2px 2px 0 #000}
.ec-pts sup{margin-left:2px;font:600 11px var(--f-ui);color:#fff;vertical-align:top}
.ec-q{font-size:13px;line-height:1.32;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ec-a{font-size:12px;color:#bfc8ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ec-a.warn{color:#ffd27a}
.ecell.empty{background:var(--blue-deep);box-shadow:inset 0 0 0 1px rgba(120,140,255,.28)}
.ecell.empty:hover{background:#0b1aa8}
.ecell.empty .ec-q{color:#93a0ee}
.badges{display:flex;gap:4px}
.badge{display:inline-flex;align-items:center;justify-content:center;height:18px;min-width:18px;padding:0 4px;border-radius:4px;background:rgba(0,0,0,.4);font:700 10.5px/1 var(--f-ui);color:#fff}
.badge.dd{background:var(--gold);color:#1b1400}
.eg-add{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border:1px dashed #3a4486;border-radius:4px;background:transparent;color:var(--ink-2);font-weight:600;font-size:14px}
.eg-add:hover{border-color:var(--gold);color:var(--gold)}
.eg-add:disabled{opacity:.35;pointer-events:none}
.ed-settings{display:flex;flex-wrap:wrap;align-items:center;gap:14px 28px;margin-top:26px;padding:16px 18px;border:1px solid var(--wire);border-radius:10px;background:var(--desk)}
.es-item{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-2)}
.ed-settings .hint{flex-basis:100%}

/* menu */
.menu{position:fixed;z-index:100;min-width:200px;padding:6px;border-radius:8px;background:var(--desk);border:1px solid var(--wire);box-shadow:0 12px 32px rgba(0,0,0,.5)}
.menu button{display:flex;width:100%;padding:8px 10px;border:0;border-radius:5px;background:none;text-align:left;font-size:14px}
.menu button:hover,.menu button:focus-visible{background:var(--desk-2)}
.menu button:disabled{opacity:.4;cursor:default;background:none}
.menu button.danger{color:#ff9ea1}
.menu hr{margin:4px 0;border:0;border-top:1px solid var(--wire)}

/* modals */
.modal-bg{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto;background:rgba(4,6,16,.74)}
.modal{width:min(1060px,100%);border-radius:12px;background:var(--desk);border:1px solid var(--wire);box-shadow:0 30px 90px rgba(0,0,0,.6)}
.modal.narrow{width:min(680px,100%)}
.modal-head{display:flex;align-items:center;gap:6px;padding:12px 14px 12px 20px;border-bottom:1px solid var(--wire)}
.mh-title{display:flex;align-items:baseline;gap:12px;min-width:0}
.mh-title b{font:700 22px/1.2 var(--f-cond);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mh-plain{font:700 18px/1.2 var(--f-ui)}
.mh-pts{font:400 22px/1 var(--f-num);color:var(--gold)}
.modal-body{padding:20px}
.modal-body.stack{display:flex;flex-direction:column;gap:12px}
.modal-foot{display:flex;align-items:center;gap:10px;padding:12px 20px;border-top:1px solid var(--wire)}
.dlg-title{margin:0 0 6px;font:700 20px/1.2 var(--f-ui)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.side{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:10px;background:var(--room);border:1px solid var(--wire)}
.side.drag{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,199,44,.15)}
.side h4{margin:0;font:700 17px/1.2 var(--f-ui)}
.side[data-side="a"] h4{color:var(--gold)}
.side .txt{background:var(--desk)}
.mlist{display:flex;flex-direction:column;gap:8px}
.mlist:empty{display:none}
.mitem{display:grid;grid-template-columns:56px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:6px;border-radius:8px;background:var(--desk);border:1px solid var(--wire)}
.mthumb{display:flex;align-items:center;justify-content:center;width:56px;height:40px;border-radius:5px;background:#000 center/cover no-repeat;color:var(--ink-2)}
.mkind{font-size:13px;font-weight:700}
.msrc{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.madd{display:flex;gap:6px}
.madd .txt{height:34px;font-size:13.5px}
.opts{display:flex;flex-wrap:wrap;align-items:center;gap:14px 30px;margin:18px 0 10px}
.chk{display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--gold)}
.chk em{margin-left:4px;font-style:normal;font-weight:400;font-size:13px;color:var(--ink-2)}
.pts-over{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-2)}
.pts-over .txt{width:110px}
.mnote{min-height:20px;font-size:13px;color:#ffd27a}
.imp-row{display:flex;align-items:center;gap:12px}
.app-toast{position:fixed;left:50%;bottom:24px;z-index:90;padding:10px 18px;border-radius:8px;background:#000;border:1px solid var(--wire);font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.5);transform:translateX(-50%);animation:appToast 2.4s ease forwards}
@keyframes appToast{0%{opacity:0;transform:translate(-50%,10px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@media (max-width:820px){.two{grid-template-columns:1fr}.topbar{padding:10px 12px}.editor{padding:18px 12px 80px}}

/* host console */
.host{display:grid;grid-template-columns:minmax(0,1fr) 384px;height:100vh;height:100dvh}
.host-main{display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0;padding:12px 14px 14px}
.host-top{display:flex;align-items:center;gap:12px;min-width:0}
.ht-title{min-width:0;font:700 20px/1.2 var(--f-cond);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ht-hint{color:var(--ink-3);font-size:13px;white-space:nowrap}
.monitor{position:relative;flex:1;min-height:0;border-radius:8px;overflow:hidden;background:#000;box-shadow:0 0 0 1px var(--wire)}
.hpanel{overflow-y:auto;background:var(--desk);border-left:1px solid var(--wire)}
.hp-sec{display:flex;flex-direction:column;gap:10px;padding:16px 18px;border-bottom:1px solid var(--wire)}
.hp-sec h3{display:flex;align-items:center;gap:8px;margin:0;font:700 15px/1.2 var(--f-ui)}
.hp-h3row{display:flex;align-items:center;justify-content:space-between}
.hp-muted{margin:0;color:var(--ink-2);font-size:13.5px}
.hp-btns{display:flex;flex-wrap:wrap;gap:8px}
.hp-live{display:flex;align-items:center;justify-content:space-between;gap:10px}
.onair{display:inline-flex;align-items:center;gap:8px;height:26px;padding:0 10px;border-radius:4px;background:#2b0e11;border:1px solid #6b2027;color:#ff9d97;font:700 13px/1 var(--f-ui)}
.onair i{width:8px;height:8px;border-radius:50%;background:var(--onair);box-shadow:0 0 8px var(--onair)}
.onair.off{background:var(--desk-2);border-color:var(--wire);color:var(--ink-2)}
.onair.off i{background:var(--ink-3);box-shadow:none}
.onair.wait i{background:#ffb020;box-shadow:0 0 8px #ffb020}
.hp-viewers{color:var(--ink-2);font-size:13px;text-align:right}
.hp-code{display:flex;align-items:baseline;gap:10px}
.hp-code span{color:var(--ink-2);font-size:13px}
.hp-code b{font:400 34px/1 var(--f-num);letter-spacing:.05em;color:#fff}
.hp-note{margin:0;font-size:13px;color:#ffd27a}
.hp-who summary{cursor:pointer;color:var(--ink-2);font-size:13.5px}
.hp-who ul{margin:6px 0 0;padding-left:18px;color:var(--ink-2);font-size:13.5px}
.hp-cluehead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.hp-cluehead b{font:700 18px/1.15 var(--f-cond);text-transform:uppercase}
.hp-cluehead span{font:400 22px/1 var(--f-num);color:var(--gold);white-space:nowrap}
.answer-box{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:10px;background:#0b0e1f;border:1px solid #4a3c0c}
.ab-label{font-size:12.5px;font-weight:700;color:#c9a53a}
.ab-ans{font:900 21px/1.3 var(--f-clue);color:var(--gold);overflow-wrap:anywhere}
.ab-ans em{font:italic 500 15px var(--f-ui);color:var(--ink-2)}
.ab-extra{font-size:12.5px;color:var(--ink-2)}
.ab-q{padding-top:8px;border-top:1px solid var(--wire);font-size:13.5px;color:var(--ink-2);overflow-wrap:anywhere}
.hp-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.hp-lbl{display:inline-flex;align-items:center;gap:6px;margin-right:4px;color:var(--ink-2);font-size:13px}
.hp-media{display:flex;flex-direction:column;gap:6px}
.hp-mrow{display:flex;align-items:center;gap:6px}
.hp-mrow span{flex:1;font-size:13px;color:var(--ink-2)}
.tag{padding:4px 7px;border-radius:999px;background:var(--desk-3);color:var(--ink-2);font:600 11.5px/1 var(--f-ui)}
.tag.ok{background:#11402a;color:#9ff0c4}
.buzz-list{display:flex;flex-direction:column;gap:4px;margin:0;padding-left:22px}
.buzz-list li{font-size:14px}
.buzz-list li:first-child{color:var(--gold);font-weight:700}
.buzz-list span{margin-left:8px;color:var(--ink-3);font-size:12.5px;font-weight:400}
.plist{display:flex;flex-direction:column;gap:2px}
.prow{display:grid;grid-template-columns:18px minmax(0,1fr) 78px auto;gap:6px;align-items:center;padding:4px 6px;border-radius:7px}
.prow.sel{background:rgba(255,199,44,.1);box-shadow:inset 0 0 0 1px rgba(255,199,44,.4)}
.prow.buzzed{background:rgba(36,64,255,.25)}
.pn{text-align:center;font-size:12px;color:var(--ink-3)}
.pname{min-width:0;height:30px;padding:0 6px;border:1px solid transparent;border-radius:6px;background:transparent;font-weight:600}
.pname:hover,.pname:focus{outline:none;border-color:var(--wire);background:var(--room)}
.pscore{width:78px;height:30px;padding:0 8px;text-align:right;border:1px solid var(--wire);border-radius:6px;background:var(--room);color:var(--gold);font:400 18px/1 var(--f-num);-moz-appearance:textfield}
.pbtns{display:flex;gap:4px}
.pbtns .btn{gap:3px;padding:0 7px}
.tgl{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 0;font-size:14px;cursor:pointer}
.tgl input{position:absolute;opacity:0;pointer-events:none}
.tgl i{position:relative;flex:none;width:34px;height:20px;border-radius:999px;background:var(--desk-3);transition:background-color .15s}
.tgl i:after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#cfd3ea;transition:transform .15s}
.tgl input:checked+i{background:#c79600}
.tgl input:checked+i:after{transform:translateX(14px);background:#fff}
.tgl input:focus-visible+i{outline:2px solid var(--gold);outline-offset:2px}
@media (max-width:1100px){.host{grid-template-columns:1fr;height:auto}.monitor{flex:none;aspect-ratio:16/9}.hpanel{overflow:visible;border-left:0;border-top:1px solid var(--wire)}}

/* stage: designed at 1920x1080, scaled to fit */
.stage-wrap{position:absolute;inset:0;overflow:hidden;background:#000}
.stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;background:#000;color:#fff;font-family:var(--f-cond);--scoresH:0px}
.board-area{position:absolute;left:0;top:0;right:0;bottom:var(--scoresH)}
.board{position:absolute;inset:0;display:flex;flex-direction:column;gap:16px;padding:10px;background:#000}
.cats,.tiles{display:grid;gap:10px}
.tiles{flex:1;min-height:0}
.cat,.tile{position:relative;background:var(--blue);box-shadow:inset 0 0 0 3px rgba(255,255,255,.05),inset 0 -26px 46px rgba(0,0,10,.28)}
.cat{display:flex;align-items:center;justify-content:center;overflow:hidden;padding:10px 14px}
.cat span{display:block;width:100%;text-align:center;font-weight:700;line-height:1.04;text-transform:uppercase;text-shadow:3px 3px 0 #000;overflow-wrap:break-word}
.tile{display:flex;align-items:center;justify-content:center;user-select:none}
.val{font-family:var(--f-num);font-size:var(--valSize,96px);line-height:1;color:var(--gold);text-shadow:5px 5px 0 #000}
.tile.empty{background:var(--blue-deep)}
.interactive .tile:not(.empty){cursor:pointer}
.interactive .tile:not(.done):not(.empty):hover{background:var(--blue-hi)}
.interactive .tile.done:hover{background:#0c1cb8}
.tile.kb{box-shadow:inset 0 0 0 7px #fff}
.board.fill .cat,.board.fill .tile{animation:tileOn .32s steps(2,end) both;animation-delay:var(--d,0s)}
.board.fill .val{animation:valOn .34s ease-out both;animation-delay:var(--d,0s)}
@keyframes tileOn{from{background:#020523;box-shadow:none}}
@keyframes valOn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.ov{position:absolute;inset:0;z-index:5}
.clue,.intro,.waiting{background:radial-gradient(ellipse 70% 60% at 50% 42%,rgba(60,90,255,.5),transparent 70%),linear-gradient(#0c22e6,#071399)}
.clue{display:flex;flex-direction:column;padding:44px 110px 52px;transform-origin:0 0}
.clue.zoom,.dd.zoom{transition:transform .42s cubic-bezier(.2,.75,.2,1)}
.interactive .clue,.interactive .dd,.interactive .intro{cursor:pointer}
.clue-head{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;height:64px;margin-bottom:20px}
.ch-cat{font:700 34px/1 var(--f-cond);text-transform:uppercase;color:#d5dbff;text-shadow:2px 2px 0 #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-right{display:flex;align-items:center;justify-content:flex-end;gap:26px}
.ch-val,.ch-time{font:400 46px/1 var(--f-num);text-shadow:3px 3px 0 #000;white-space:nowrap}
.ch-val{color:var(--gold)}
.ch-time.low{color:#ff8a8d}
.clue-body{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:28px}
.clue-text,.clue-ans{flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
.clue-text>div,.clue-ans>div{width:100%;text-align:center;font-family:var(--f-clue);font-weight:900;line-height:1.24;text-transform:uppercase;text-shadow:4px 4px 0 #000;overflow-wrap:break-word}
.clue-ans{border-top:4px solid rgba(255,199,44,.55);padding-top:20px}
.clue-ans>div{color:var(--gold)}
.clue-media{flex:none;display:flex;justify-content:center;gap:28px;min-height:0}
.mbox{flex:1 1 0;min-width:0;height:100%;display:flex;align-items:center;justify-content:center}
.mbox img,.mbox video{display:block;width:100%;height:100%;object-fit:contain}
.mbox iframe{display:block;width:min(100%,calc(var(--mh,600px) * 1.7778));height:auto;max-height:100%;aspect-ratio:16/9;border:0;background:#000;box-shadow:0 0 0 4px #000}
.mbox.spotify iframe{width:min(100%,960px);height:min(352px,100%);aspect-ratio:auto;border-radius:12px}
.aud{display:flex;flex-direction:column;align-items:center;gap:26px;width:min(100%,960px)}
.aud .ic{color:var(--gold);filter:drop-shadow(6px 6px 0 #000)}
.aud audio{width:100%}
.mlink{display:flex;align-items:center;gap:22px;max-width:100%;padding:26px 40px;border-radius:14px;background:rgba(0,0,30,.4);border:3px solid rgba(255,255,255,.3);color:#fff;text-decoration:none;font:700 42px/1.15 var(--f-cond)}
.mlink span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mlink .ic{color:var(--gold)}
.timer{position:absolute;left:0;right:0;top:0;height:12px;background:rgba(0,0,0,.4)}
.timer i{display:block;height:100%;background:var(--gold);transform-origin:0 50%}
.timer.out i{background:var(--bad)}
.timer.out{animation:timeFlash .5s steps(2) 3}
@keyframes timeFlash{50%{background:var(--bad)}}
.buzz-pill{display:inline-flex;align-items:center;gap:14px;max-width:860px;height:64px;padding:0 30px 0 22px;border-radius:999px;background:var(--gold);color:#160f00;box-shadow:5px 5px 0 #000;font:700 40px/1 var(--f-cond);text-transform:uppercase;white-space:nowrap;animation:pop .35s cubic-bezier(.2,.9,.3,1.3) both}
.buzz-pill b{overflow:hidden;text-overflow:ellipsis}
.buzz-pill small{font:700 26px/1 var(--f-cond);opacity:.65}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
.dd{display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;transform-origin:0 0;background:radial-gradient(circle at 50% 50%,#2a48ff 0%,#0a1fd4 38%,#040b5e 100%)}
.rays{position:absolute;left:50%;top:50%;width:3000px;height:3000px;margin:-1500px 0 0 -1500px;background:repeating-conic-gradient(rgba(255,255,255,.07) 0deg 9deg,transparent 9deg 18deg);animation:spin 26s linear infinite}
.dd h1{position:relative;margin:0;text-align:center;font:400 270px/.93 var(--f-num);text-transform:uppercase;color:var(--gold);text-shadow:12px 12px 0 #000;animation:ddIn 1s cubic-bezier(.2,.9,.25,1.15) both}
.ddcat{position:relative;margin-top:40px;font:700 50px/1 var(--f-cond);text-transform:uppercase;text-shadow:3px 3px 0 #000}
@keyframes ddIn{0%{transform:scale(.08) rotate(-24deg);opacity:0}70%{opacity:1}100%{transform:none}}
@keyframes spin{to{transform:rotate(1turn)}}
.intro,.waiting{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:80px 110px}
.in-title{display:flex;align-items:center;justify-content:center;width:1700px;height:500px}
.in-title h1{width:100%;margin:0;font:400 180px/.95 var(--f-num);text-transform:uppercase;color:var(--gold);text-shadow:9px 9px 0 #000;overflow-wrap:break-word}
.in-sub,.w-sub{margin:26px 0 0;font:700 46px/1.2 var(--f-cond);text-shadow:3px 3px 0 #000}
.in-join{margin-top:64px;font:600 38px/1.3 var(--f-cond);color:#d5dbff}
.in-join b{color:#fff}
.w-title{font:400 150px/1 var(--f-num);text-transform:uppercase;color:var(--gold);text-shadow:8px 8px 0 #000}
.final{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:50px 120px;background:#000}
.final h1{margin:0;font:400 120px/1 var(--f-num);text-transform:uppercase;color:var(--gold);text-shadow:7px 7px 0 #000}
.final ol{display:flex;flex-direction:column;gap:14px;width:min(1400px,100%);margin:0;padding:0;list-style:none}
.final li{display:grid;grid-template-columns:1.6em minmax(0,1fr) auto;align-items:center;gap:.6em;padding:0 .8em;background:var(--blue);box-shadow:6px 6px 0 #222a66;font-weight:700;line-height:1;text-transform:uppercase}
.final li .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.final li .rk{font-family:var(--f-num);font-weight:400;color:#c6cdfd}
.final li .pt{font-family:var(--f-num);font-weight:400;color:var(--gold);text-shadow:4px 4px 0 #000}
.final li.win{background:var(--gold);color:#1b1400;box-shadow:6px 6px 0 #7a5a00}
.final li.win .rk,.final li.win .pt{color:#1b1400;text-shadow:none}
.paused{position:absolute;left:50%;top:24px;z-index:12;padding:14px 30px;border-radius:999px;background:rgba(0,0,0,.78);font:700 34px/1 var(--f-cond);transform:translateX(-50%)}
.confetti{position:absolute;inset:0;z-index:15;pointer-events:none}
.scores{position:absolute;left:0;right:0;bottom:0;display:flex;gap:10px;height:var(--scoresH);padding:0 10px 10px;background:#000}
.scores:empty{display:none}
.sc{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--blue);box-shadow:inset 0 0 0 3px rgba(255,255,255,.05);transition:background-color .2s}
.sc .nm{max-width:92%;font-weight:700;line-height:1.05;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:2px 2px 0 #000}
.sc .pt{font-family:var(--f-num);line-height:1;text-shadow:3px 3px 0 #000}
.sc .pt.neg{color:#ff9a9c}
.sc.buzzed{background:var(--blue-hi);box-shadow:inset 0 0 0 5px var(--gold)}
.sc.flash-ok{animation:flashOk 1s ease-out}
.sc.flash-bad{animation:flashBad 1s ease-out}
@keyframes flashOk{0%,30%{background:#16a35c}}
@keyframes flashBad{0%,30%{background:#c4323a}}
.toasts{position:absolute;left:0;right:0;top:28px;z-index:20;display:flex;flex-direction:column;align-items:center;gap:12px;pointer-events:none}
.toast{padding:12px 36px;border-radius:12px;background:#000;box-shadow:0 0 0 5px currentColor;font:400 70px/1 var(--f-num);text-transform:uppercase;animation:toast 1.9s ease-out forwards}
.toast.ok{color:var(--ok)}
.toast.bad{color:var(--bad)}
@keyframes toast{0%{opacity:0;transform:translateY(24px) scale(.92)}12%{opacity:1;transform:none}78%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}

/* display tab and players */
body.is-screen{overflow:hidden;background:#000}
.viewer{position:fixed;inset:0;display:flex;flex-direction:column;background:#000}
.screen-host{position:relative;flex:1;min-height:0}
.chrome{position:fixed;top:12px;right:12px;z-index:40;display:flex;gap:8px;transition:opacity .3s}
body.idle .chrome{opacity:0}
body.idle{cursor:none}
.pill{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.65);color:#fff;font:600 13px/1 var(--f-ui)}
button.pill{cursor:pointer}
.pill .dot{width:8px;height:8px;border-radius:50%;background:#ffb020}
.pill.ok .dot{background:var(--ok)}
.pill.bad .dot{background:var(--bad)}
.pbar{flex:none;display:flex;align-items:center;justify-content:center;gap:18px;height:96px;background:#05070f;border-top:1px solid #1d2240}
.buzzbtn{height:64px;min-width:260px;padding:0 40px;border:0;border-radius:999px;background:var(--bad);color:#fff;font:400 34px/1 var(--f-num);text-transform:uppercase;letter-spacing:.03em;box-shadow:0 6px 0 #8a1f25}
.buzzbtn:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 #8a1f25}
.buzzbtn:disabled{background:#2a2f4c;color:#7d84ad;box-shadow:0 6px 0 #171a2e;cursor:default}
.buzzbtn.first{background:var(--gold);color:#1b1400;box-shadow:0 6px 0 #8a6a00}
.pbar-note{min-width:190px;color:var(--ink-2);font-size:15px}
.cover{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;background:rgba(0,0,0,.62)}
.cover p{max-width:460px;margin:0;color:#e3e6f7}
.nudge{position:absolute;left:50%;bottom:24px;z-index:45;transform:translateX(-50%)}
.join-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;padding:24px;background:radial-gradient(ellipse at 50% 30%,#1a32f0,#060f80 60%,#02052e)}
.join-card{display:flex;flex-direction:column;gap:16px;width:min(420px,100%);padding:28px;border-radius:14px;background:var(--desk);border:1px solid var(--wire);box-shadow:0 30px 80px rgba(0,0,0,.5)}
.jc-brand{font:400 22px/1 var(--f-num);color:var(--gold)}
.join-card h1{margin:0;font:700 34px/1.1 var(--f-cond);color:#fff}
.room{font:400 22px/1 var(--f-num);letter-spacing:.06em;color:#fff}
@media (prefers-reduced-motion:reduce){.clue.zoom,.dd.zoom{transition:none}.board.fill .cat,.board.fill .tile,.board.fill .val,.dd h1,.rays,.toast,.buzz-pill,.sc.flash-ok,.sc.flash-bad,.timer.out,.app-toast{animation:none!important}}

/* ---------- look and feel: game-show studio backdrop, bigger type ---------- */
body{font-size:16px;background:#06081a}
body:not(.is-screen)::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:
  radial-gradient(1100px 520px at 50% -160px,rgba(52,88,255,.5),transparent 70%),
  conic-gradient(from 148deg at 12% -8%,transparent 0deg,rgba(120,150,255,.22) 9deg,transparent 18deg),
  conic-gradient(from 194deg at 88% -8%,transparent 0deg,rgba(120,150,255,.22) 9deg,transparent 18deg),
  radial-gradient(1400px 600px at 50% 115%,rgba(255,199,44,.1),transparent 70%),
  linear-gradient(180deg,#0b1240 0%,#080c26 45%,#06081a 100%)}
body:not(.is-screen)::after{content:"";position:fixed;left:-20%;right:-20%;bottom:-8vh;height:50vh;z-index:-1;pointer-events:none;
  background-image:linear-gradient(rgba(120,140,255,.15) 1px,transparent 1px),linear-gradient(90deg,rgba(120,140,255,.15) 1px,transparent 1px);
  background-size:72px 72px;transform:perspective(520px) rotateX(58deg);transform-origin:50% 100%;
  -webkit-mask-image:linear-gradient(to top,#000 10%,transparent 85%);mask-image:linear-gradient(to top,#000 10%,transparent 85%)}

/* app type scale */
.btn{height:40px;font-size:15px;padding:0 16px}
.btn.sm{height:34px;font-size:14px;padding:0 12px}
.btn.icon{width:40px}.btn.sm.icon{width:34px}
.btn.big{height:52px;font-size:18px}
.hint{font-size:15px}
.small{font-size:13.5px}
.txt{font-size:16px}
select,.game-pick{font-size:15px}
.topbar{padding:12px 24px;background:rgba(8,12,34,.62);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2)}
.brand{font-size:31px}
.game-pick{height:40px}
.title-in{font-size:48px;background:transparent}
.meta{font-size:15.5px}

.eg-row{background:rgba(12,16,40,.92)}
.eg-cat{min-height:92px}
.cat-in{height:auto;min-height:28px;max-height:72px;field-sizing:content;font-size:22px}
.pts-in{height:44px;font-size:25px}
.ecell{min-height:126px;padding:11px 12px;gap:6px}
.ec-pts{font-size:27px}
.ec-q{font-size:15px;line-height:1.35}

.badge{height:20px;min-width:20px}
.eg-add{font-size:15px;background:rgba(12,16,40,.6)}
.ed-settings{background:rgba(20,25,58,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.es-item{font-size:15px}

.mh-pts{font-size:26px}

.tipbox b{color:#ffe08a}
.example{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.example code{flex:1;min-width:260px;padding:8px 10px;border-radius:6px;background:var(--room);border:1px solid var(--wire);font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#ffe08a;user-select:all;overflow-wrap:anywhere}

/* host console */
.host{grid-template-columns:minmax(0,1fr) 430px}
.ht-title{font-size:24px}
.ht-hint{font-size:14px}
.monitor{box-shadow:0 0 0 1px rgba(255,255,255,.08),0 24px 70px rgba(0,0,0,.6),0 0 120px rgba(36,64,255,.22)}
.hpanel{background:rgba(16,21,50,.84);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.hp-sec{gap:12px;padding:18px 20px}

/* stage: bigger header, richer backgrounds */
.ch-cat{font-size:44px}
.ch-val,.ch-time{font-size:58px}
.clue{background:radial-gradient(ellipse 75% 65% at 50% 40%,rgba(70,100,255,.45),transparent 72%),linear-gradient(115deg,rgba(255,255,255,.07) 0%,transparent 32%),linear-gradient(#0c22e6,#06118f)}
.intro,.waiting{background:radial-gradient(ellipse 60% 55% at 50% 45%,rgba(70,100,255,.55),transparent 70%),radial-gradient(ellipse at 50% 125%,rgba(255,199,44,.2),transparent 60%),linear-gradient(#0c22e6,#050f86)}
.final{background:radial-gradient(ellipse 70% 60% at 50% 35%,rgba(40,70,255,.45),transparent 70%),linear-gradient(#081060,#02041c)}
.in-sub,.w-sub{font-size:54px}
.in-join{font-size:44px}
.in-title,.in-sub,.in-join,.w-title,.w-sub,.final h1,.final ol{position:relative;z-index:1}
.marquee{position:absolute;inset:34px;z-index:0;pointer-events:none}
.marquee i{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:#fff4c8;box-shadow:0 0 6px 2px #ffd34d,0 0 20px 7px rgba(255,199,44,.5);animation:bulb 1.1s linear infinite}
.marquee i.b{animation-delay:-.55s}
@keyframes bulb{0%,49.9%{opacity:1}50%,100%{opacity:.2}}
.beams{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.beams:before,.beams:after{content:"";position:absolute;top:-25%;width:64%;height:165%;transform-origin:50% 0;background:conic-gradient(from 166deg at 50% 0%,transparent 0deg,rgba(255,255,255,.14) 14deg,transparent 28deg);animation:sweep 7s ease-in-out infinite alternate}
.beams:before{left:-10%}
.beams:after{right:-10%;animation-delay:-3.5s;animation-direction:alternate-reverse}
@keyframes sweep{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.join-screen{position:relative;overflow:hidden}
.join-screen::before,.join-screen::after{content:"";position:absolute;top:-20%;width:60%;height:150%;pointer-events:none;transform-origin:50% 0;background:conic-gradient(from 166deg at 50% 0%,transparent 0deg,rgba(255,255,255,.12) 14deg,transparent 28deg)}
.join-screen::before{left:-6%;transform:rotate(-14deg)}
.join-screen::after{right:-6%;transform:rotate(14deg)}
.join-card{position:relative;z-index:1}
.join-card h1{font-size:40px}
.pbar-note{font-size:16px}
@media (prefers-reduced-motion:reduce){.marquee i,.beams:before,.beams:after{animation:none!important}}

/* ---------- game-night features ---------- */
.hside{display:flex;flex-direction:column;min-height:0;background:rgba(16,21,50,.86);border-left:1px solid var(--wire);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.hside .hpanel{flex:1;min-height:0;overflow-y:auto;background:transparent;border:0;backdrop-filter:none;-webkit-backdrop-filter:none}
.hp-chat{flex:none;display:flex;flex-direction:column;height:270px;border-top:1px solid var(--wire);background:rgba(6,9,26,.55)}
.hp-chat.min{height:auto}
.hp-chat.min .hc-log,.hp-chat.min .hc-form{display:none}
.hc-head{display:flex;align-items:center;gap:8px;padding:10px 12px 4px 20px;color:var(--ink-2)}

.prow.picks{box-shadow:inset 3px 0 0 var(--gold)}

/* stage additions */
.sc{position:relative}
.sc.picker{box-shadow:inset 0 0 0 5px var(--gold),0 0 30px rgba(255,199,44,.35)}

/* ---------- storage: IndexedDB with an in-memory fallback ---------- */
const Store = (() => {
  let dbp = null, broken = false;
  const mem = new Map();
  function open() {
    if (!dbp) {
      dbp = new Promise((res, rej) => {
        if (!window.indexedDB) return rej(new Error('no indexedDB'));
        const r = indexedDB.open('amx-trivia', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
        r.onblocked = () => rej(new Error('blocked'));
      });
      dbp.catch(() => { broken = true; });
    }
    return dbp;
  }
  function run(mode, fn) {
    return open().then(db => new Promise((res, rej) => {
      const tx = db.transaction('kv', mode), req = fn(tx.objectStore('kv'));
      tx.oncomplete = () => res(req ? req.result : undefined);
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error);
    }));
  }
  return {
    async get(k) { try { return await run('readonly', s => s.get(k)); } catch (e) { return mem.has(k) ? clone(mem.get(k)) : undefined; } },
    async set(k, v) {
      try { await run('readwrite', s => s.put(v, k)); }
      catch (e) { if (broken) { mem.set(k, clone(v)); return; } throw e; }
    },
    async del(k) { try { await run('readwrite', s => s.delete(k)); } catch (e) { mem.delete(k); } },
    get broken() { return broken; }
  };
})();

    timeup() { tone(233, 0, 1, 'square', 0.25); tone(220, 0, 1, 'sawtooth', 0.18); },
    buzz() { tone(1046, 0, 0.12, 'square', 0.3); tone(1568, 0.1, 0.16, 'square', 0.25); },
    tick() { tone(1400, 0, 0.04, 'square', 0.12); },

function normalizeGame(o) {

  const g = newGame(0, 0, String(o.title || o.name || 'Imported game').slice(0, 200));

    const firstLen = o.cats[0] && Array.isArray(o.cats[0].cells) ? o.cats[0].cells.length : 1;
    const rows = Array.isArray(o.rows) && o.rows.length ? o.rows : Array.from({ length: firstLen }, (_, i) => (i + 1) * 100);
    g.rows = rows.map((v, i) => isNaN(+v) ? (i + 1) * 100 : +v);
    g.cats = o.cats.map(c => ({ name: String((c && c.name) || ''), cells: g.rows.map((_, r) => normCell(c && Array.isArray(c.cells) ? c.cells[r] : null, true)) }));

    const list = c => Array.isArray(c.clues) ? c.clues : Array.isArray(c.questions) ? c.questions : [];
    const nR = Math.max(1, ...cats.map(c => list(c).length));
    g.rows = Array.from({ length: nR }, (_, r) => {
      for (const c of cats) { const v = list(c)[r]; const p = v && +(v.points ?? v.value); if (p) return p; }
      return (r + 1) * 100;

    g.cats = cats.map(c => ({
      name: String(c.name ?? c.category ?? c.title ?? ''),
      cells: g.rows.map((rp, r) => {

      el.mid.innerHTML = first ? `<div class="buzz-pill">${icon('bolt', 38)}<b>${esc(first.name)}</b><small></small></div>`
        : open ? `<div class="buzz-pill open">${icon('bolt', 38)}<b>Buzz now</b></div>` : '';
    }
    const sm = $('small', el.mid);
    if (sm) sm.textContent = b.order.length > 1 ? `+${b.order.length - 1}` : '';
  }

  function fx(m) {
    if (m.sound && soundOn()) SFX.play(m.sound);
    if (m.toast) toast(m.toast, m.tone);
    if (m.flash) {
      const n = Array.from(el.scores.children).find(x => x.dataset.id === m.flash);
      if (n) { n.classList.remove('flash-ok', 'flash-bad'); void n.offsetWidth; n.classList.add(m.tone === 'bad' ? 'flash-bad' : 'flash-ok'); }
    }
    if (m.confetti) confetti();
    if (m.spin) spin(m.spin);
  }
  let spinT = 0;
  function spin(sp) {
    clearTimeout(spinT);
    const names = (sp.names || []).map(String), n = names.length; if (!n) return;
    const w = clamp(+sp.winner || 0, 0, n - 1), ms = +sp.ms || 3000, delays = [];
    let d = 55, total = 0;
    while (total < ms - 150) { delays.push(d); total += d; d *= 1.09; }
    const steps = Math.max(1, delays.length);
    let i = ((w - (steps - 1)) % n + n) % n, k = 0;
    el.spin.classList.remove('hidden', 'done'); el.spSub.textContent = '';
    const step = () => {
      el.spName.textContent = names[i];
      if (k >= steps - 1) {
        el.spin.classList.add('done'); el.spSub.textContent = 'picks first';
        if (soundOn()) SFX.play('correct');
        spinT = setTimeout(() => el.spin.classList.add('hidden'), 2800);
        return;
      }
      if (soundOn()) SFX.play('tick');
      i = (i + 1) % n; spinT = setTimeout(step, delays[k++]);
    };
    step();
  }
  function toast(text, tone) {
    const d = document.createElement('div');
    d.className = 'toast ' + (tone || ''); d.textContent = text;
    el.toasts.appendChild(d); setTimeout(() => d.remove(), 1950);
  }
  function fillAnim() {
    if (REDUCED) return;
    $$('.tile, .cat', el.board).forEach(t => t.style.setProperty('--d', (Math.random() * 1.1).toFixed(2) + 's'));
    el.board.classList.remove('fill'); void el.board.offsetWidth; el.board.classList.add('fill');
    clearTimeout(fillT); fillT = setTimeout(() => el.board.classList.remove('fill'), 1800);
  }
  function confetti() {
    if (REDUCED) return;
    const cv = el.confetti, ctx = cv.getContext('2d'); cv.classList.remove('hidden');
    const cols = ['#ffc72c', '#ffffff', '#2440ff', '#36d07f', '#ff5a5f'];
    const ps = Array.from({ length: 220 }, () => ({ x: Math.random() * W, y: -20 - Math.random() * H * 0.6, vx: (Math.random() - 0.5) * 6, vy: 4 + Math.random() * 6, r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3, w: 10 + Math.random() * 12, h: 6 + Math.random() * 8, c: cols[(Math.random() * cols.length) | 0] }));
    const t0 = performance.now();
    (function frame(t) {
      ctx.clearRect(0, 0, W, H);
      for (const p of ps) { p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore(); }
      if (t - t0 < 5500) requestAnimationFrame(frame); else { ctx.clearRect(0, 0, W, H); cv.classList.add('hidden'); }
    })(t0);
  }

  return {
    handle, setMuted,
    setSel(s) { self.sel = s; markSel(); },
    setPickable(v) { self.pickable = !!v; stage.classList.toggle('pickable', self.pickable); },
    setWait(t) { $('.w-sub', el.waiting).textContent = t; },
    refit() { keys.board = keys.layout = keys.intro = keys.final = keys.scores = null; keys.fonts = (keys.fonts || 0) + 1; if (self.S) render(); },
    get state() { return self.S; }
  };
}

async function persist(g) {

  const meta = { id: g.id, title: g.title, updated: g.updated, size: g.cats.length + ' \u00d7 ' + g.rows.length, clues: g.cats.reduce((n, c) => n + c.cells.filter(cellFilled).length, 0) }, i = games.findIndex(x => x.id === g.id);
  if (i < 0) games.push(meta); else games[i] = meta;

}

async function loadGame(id) {

/* board links: #add=<compressed game>. The part after # never reaches the server, so answers stay private. */
const b64urlToBytes = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const bin = atob(s); return Uint8Array.from(bin, c => c.charCodeAt(0)); };
function bytesToB64url(b) { let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
async function addFromHash() {
  const m = location.hash.match(/^#add=([A-Za-z0-9_-]+)$/); if (!m) return false;
  history.replaceState(null, '', location.pathname + location.search);
  try {
    if (!window.DecompressionStream) throw new Error('old browser');
    const text = await new Response(new Blob([b64urlToBytes(m[1])]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
    const obj = JSON.parse(text), g = normalizeGame(obj);
    if (games.some(x => x.id === g.id)) { G = await loadGame(g.id) || G; lsSet('tn.current', G.id); flashMsg(`\u201c${g.title}\u201d is already in your games`); return true; }
    g.live = freshLive(); g.cats.forEach(c => c.cells.forEach(x => { x.played = false; }));
    await persist(g); G = g; lsSet('tn.current', g.id);
    flashMsg(`Added \u201c${g.title}\u201d to your games`);
    return true;
  } catch (e) { flashMsg('That game link didn\u2019t work. Try opening it in Chrome or Edge.'); return false; }
}
async function copyBoardLink() {
  saveSoon.flush();
  const g = clone(G); delete g.live; g.cats.forEach(c => c.cells.forEach(x => { delete x.played; }));
  const raw = new TextEncoder().encode(JSON.stringify({ app: 'trivia-night', version: 1, game: g }));
  const packed = new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer());
  const url = location.origin + location.pathname + '#add=' + bytesToB64url(packed);
  if (url.length > 200000) { flashMsg('This game has big uploaded files, so the link would be too long. Use Export instead.'); return; }
  await copyText(url);
  flashMsg('Link copied. It includes the answers, so only send it to co-hosts.');
}

/* board structure */
function afterStructure() { if (G.live.open) G.live.open = null; saveSoon(); renderEditor(); }
function insertCol(i) {
  if (G.cats.length >= MAX_COLS) return;
  G.cats.splice(i, 0, { name: '', cells: G.rows.map(emptyCell) });
  afterStructure();
  const t = $(`.cat-in[data-c="${i}"]`); if (t) t.focus();
}
function deleteCol(i) {
  const cat = G.cats[i], n = cat.cells.filter(cellFilled).length;
  if (n && !confirm(`Delete \u201c${cat.name || 'this category'}\u201d and its ${plural(n, 'clue')}?`)) return;
  G.cats.splice(i, 1); afterStructure();
}
function moveCol(i, d) { const j = i + d; if (j < 0 || j >= G.cats.length) return; [G.cats[i], G.cats[j]] = [G.cats[j], G.cats[i]]; afterStructure(); }
function clearCol(i) { if (!confirm('Clear every clue in this category?')) return; G.cats[i].cells = G.rows.map(emptyCell); afterStructure(); }
function insertRow(i) {
  if (G.rows.length >= MAX_ROWS) return;
  const rows = G.rows; let v;
  if (i >= rows.length) { const last = +rows[rows.length - 1] || 0, prev = rows.length > 1 ? +rows[rows.length - 2] : 0; v = last + ((last - prev) || 100); }
  else v = rows[i];
  rows.splice(i, 0, v);
  G.cats.forEach(c => c.cells.splice(i, 0, emptyCell()));
  afterStructure();
}
function deleteRow(i) {
  const n = G.cats.filter(c => cellFilled(c.cells[i])).length;
  if (n && !confirm(`Delete this row and its ${plural(n, 'clue')}?`)) return;
  G.rows.splice(i, 1); G.cats.forEach(c => c.cells.splice(i, 1)); afterStructure();
}
function moveRow(i, d) { const j = i + d; if (j < 0 || j >= G.rows.length) return; G.cats.forEach(c => { [c.cells[i], c.cells[j]] = [c.cells[j], c.cells[i]]; }); afterStructure(); }

/* games */
async function duplicateGame() {
  const g = clone(G); g.id = uid(); g.title = (G.title || 'Untitled game') + ' (copy)'; g.created = Date.now();
  g.live = freshLive(); g.cats.forEach(c => c.cells.forEach(x => { x.played = false; }));
  await addGame(g); flashMsg('Game duplicated');
}
async function deleteGame() {
  if (!confirm(`Delete \u201c${G.title || 'Untitled game'}\u201d? This can\u2019t be undone. Export it first if you might want it later.`)) return;
  const id = G.id;
  await Store.del('game:' + id);
  games = games.filter(x => x.id !== id);
  await Store.set('index', games);
  if (!games.length) { await addGame(newGame()); return; }
  const next = games.slice().sort((a, b) => (b.updated || 0) - (a.updated || 0))[0];
  await switchGame(next.id);
}
function joinPrompt() {
  const c = prompt('Room code');
  if (c && c.trim()) location.href = location.pathname + '?join=' + encodeURIComponent(c.trim().toUpperCase());
}
function exportGame() {
  saveSoon.flush();
  const g = clone(G); delete g.live; g.cats.forEach(c => c.cells.forEach(x => { delete x.played; }));
  const blob = new Blob([JSON.stringify({ app: 'trivia-night', version: 1, game: g }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = (slug(G.title) || 'trivia-game') + '.json';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  flashMsg('Exported');
}

/* popover menu */
function showMenu(anchor, items) {
  closeMenu();
  const m = document.createElement('div'); m.className = 'menu'; m.setAttribute('role', 'menu');
  items.forEach(it => {
    if (it === '-') { m.appendChild(document.createElement('hr')); return; }
    const [label, fn, disabled, cls] = it, b = document.createElement('button');
    b.type = 'button'; b.textContent = label; b.setAttribute('role', 'menuitem');
    if (cls) b.className = cls;
    if (disabled) b.disabled = true;
    b.onclick = () => { closeMenu(); fn(); };
    m.appendChild(b);
  });
  document.body.appendChild(m);
  const r = anchor.getBoundingClientRect(), mw = m.offsetWidth, mh = m.offsetHeight;
  m.style.left = clamp(r.left, 8, innerWidth - mw - 8) + 'px';
  m.style.top = (r.bottom + 6 + mh > innerHeight ? Math.max(8, r.top - mh - 6) : r.bottom + 6) + 'px';
  const outside = e => { if (!m.contains(e.target)) closeMenu(); };
  const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); closeMenu(); anchor.focus(); } };
  setTimeout(() => { document.addEventListener('pointerdown', outside, true); document.addEventListener('keydown', onKey, true); }, 0);
  UI.menu = { el: m, off() { document.removeEventListener('pointerdown', outside, true); document.removeEventListener('keydown', onKey, true); } };

/* generic modal */
function openModal(html) {
  const bg = document.createElement('div'); bg.className = 'modal-bg'; bg.innerHTML = html;
  document.body.appendChild(bg);
  const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); close(); } };
  const close = () => { bg.remove(); document.removeEventListener('keydown', onKey, true); };
  document.addEventListener('keydown', onKey, true);
  bg.addEventListener('mousedown', e => { bg._down = e.target === bg; });
  bg.addEventListener('click', e => { if ((e.target === bg && bg._down) || e.target.closest('[data-m="close"]')) close(); });
  return { bg, close };
}
function choose(title, text, options) {

    let done = false;
    const finish = v => { if (done) return; done = true; close(); res(v || null); };

    new MutationObserver((_, obs) => { if (!bg.isConnected) { obs.disconnect(); finish(null); } }).observe(document.body, { childList: true });
    const p = $('.btn.primary', bg); if (p) p.focus();
  });
}

const YT_EXAMPLE = 'https://www.youtube.com/watch?v=dQw4w9WgXcQ&t=45';
const readURL = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(f); });
const IMG_MAX = 1440;
const loadImg = url => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
function drawTo(img, max, q, keepAlpha) {
  const s = Math.min(1, max / Math.max(img.naturalWidth || 1, img.naturalHeight || 1));
  const cv = document.createElement('canvas');
  cv.width = Math.max(1, Math.round((img.naturalWidth || max) * s)); cv.height = Math.max(1, Math.round((img.naturalHeight || max) * s));
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  let out = cv.toDataURL('image/webp', q);
  if (!out.startsWith('data:image/webp')) out = keepAlpha ? cv.toDataURL('image/png') : cv.toDataURL('image/jpeg', q);
  return out;
}
async function imageToMedia(f, note) {
  const url = URL.createObjectURL(f);
  try {
    let img;
    try { img = await loadImg(url); }
    catch (e) { note(`Couldn\u2019t open ${f.name}. Save it as a JPG or PNG and try again.`); return null; }
    const type = f.type || '', alpha = /png|gif|svg|webp/.test(type), big = Math.max(img.naturalWidth, img.naturalHeight);
    const thumb = drawTo(img, 160, 0.72, alpha);
    let src;
    if (type === 'image/gif' || type === 'image/svg+xml') {
      if (f.size > 6e6) { note(`${f.name} is ${fmtBytes(f.size)}. Animated GIFs can\u2019t be shrunk, so keep them under 6 MB.`); return null; }
      src = await readURL(f);
    } else if (big <= IMG_MAX && f.size < 300e3) src = await readURL(f);
    else src = drawTo(img, IMG_MAX, 0.82, alpha);
    const after = src.length * 0.75;
    note(after < f.size * 0.9 ? `${f.name} shrunk from ${fmtBytes(f.size)} to ${fmtBytes(after)}.` : `${f.name} added (${fmtBytes(after)}).`);
    return { src, kind: 'image', name: f.name, thumb };
  } finally { URL.revokeObjectURL(url); }
}
async function fileToMedia(f, note) {
  const type = f.type || '';
  if (type.startsWith('image/') || /\.(png|jpe?g|gif|webp|avif|bmp|svg)$/i.test(f.name)) return imageToMedia(f, note);
  if (type.startsWith('audio/') || type.startsWith('video/')) {
    if (f.size > 30e6) { note(`${f.name} is ${fmtBytes(f.size)}. Files over 30 MB are too big to send to players. Upload it to YouTube (unlisted) or Google Drive and paste the link.`); return null; }
    if (f.size > 8e6) note(`${f.name} is ${fmtBytes(f.size)}. It works, but people who joined get it when the clue opens, so it can take a moment. YouTube or Drive links start faster.`);
    return { src: await readURL(f), kind: type.startsWith('audio/') ? 'audio' : 'video', name: f.name };
  }
  note(`${f.name} isn\u2019t an image, audio or video file.`);
  return null;
}
const cssUrl = src => String(src).replace(/['"\\\n\r()]/g, ch => encodeURIComponent(ch));
function mediaThumb(m) {
  const k = kindOf(m);
  if (k === 'image' && (m.thumb || safeSrc(m.src))) return `<div class="mthumb" style="background-image:url('${cssUrl(m.thumb || directSrc(m.src))}')"></div>`;
  if (k === 'youtube' || k === 'ytaudio') { const y = ytInfo(m.src); if (y) return `<div class="mthumb" style="background-image:url('https://i.ytimg.com/vi/${encodeURIComponent(y.id)}/mqdefault.jpg')"></div>`; }
  return `<div class="mthumb">${icon(KIND_ICON[k] || 'link', 20)}</div>`;
}
function srcLabel(m) {
  if (String(m.src).startsWith('data:')) return `${m.name || 'Uploaded file'} (${fmtBytes(m.src.length * 0.75)})`;
  return m.src;
}

/* ---------- actions ---------- */

  const used = G.cats.some(c => c.cells.some(x => x.played)) || G.live.players.some(p => p.score) || G.live.phase !== 'intro';
  if (used && !opts.silent) {

    if (!v) return;

    const wrong = Array.from(b.out).filter(pid => !b.early.some(e => e.pid === pid)).map(pid => (G.live.players[playerByPid(pid)] || {}).name).filter(Boolean);
    if (b.early.length) h += `<p class="hp-note">Too early, locked out: ${b.early.map(e => esc(e.name)).join(', ')}</p>`;
    if (wrong.length) h += `<p class="hp-muted small">Already answered: ${wrong.map(esc).join(', ')}</p>`;
  }
  h += `<div class="hp-btns">${o.revealed ? `<button class="btn primary" data-act="close">Back to the board <span class="kbd">Space</span></button>` : `<button class="btn primary" data-act="reveal">${b.order.length || o.dd ? 'Reveal answer' : 'Nobody got it: reveal'} <span class="kbd">Space</span></button><button class="btn" data-act="close">Back to the board <span class="kbd">Esc</span></button>`}</div>
    <div class="hp-row"><span class="hp-lbl">${icon('timer', 16)}Timer</span>${[5, 10, 15, 30].map(s => `<button class="btn sm" data-act="timer" data-s="${s}">${s}s</button>`).join('')}${RT.timer ? '<button class="btn sm ghost" data-act="stopTimer">Stop</button>' : ''}</div>`;
  const items = [...cell.qm.map((m, i) => ['q', i, m]), ...(o.revealed ? cell.am.map((m, i) => ['a', i, m]) : [])].filter(x => PLAYABLE.includes(kindOf(x[2])));
  if (items.length) h += `<div class="hp-media">${items.map(([s, i, m]) => `<div class="hp-mrow"><span>${esc(KIND_LABEL[kindOf(m)])}${s === 'a' ? ' with the answer' : ''}</span>${[['play', 'Play'], ['pause', 'Pause'], ['restart', 'Restart']].map(([a, t]) => `<button class="btn sm icon" data-act="media" data-side="${s}" data-i="${i}" data-a="${a}" title="${t}" aria-label="${t}">${icon(a, 16)}</button>`).join('')}</div>`).join('')}</div>`;
  if (S.buzzers && !o.dd && b.openedAt && !o.revealed) h += `<button class="btn sm ghost" data-act="buzzReset">Clear buzzes and lockouts</button>`;
  h += `<button class="btn sm ghost" data-act="keep">Close and keep this tile on the board</button></section>`;
  return h;
}

function bindPanel(pane) {
  pane.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    const d = b.dataset, i = +d.i;
    switch (d.act) {
      case 'copyInvite': copyText(joinUrl()).then(() => flashMsg('Invite link copied')); break;
      case 'openDisplay': { const w = window.open(location.pathname + '?display=1', 'amx-trivia-display'); if (!w) flashMsg('The browser blocked the new tab. Allow pop-ups for this site.'); break; }
      case 'showBoard': case 'backToBoard': G.live.phase = 'board'; commit(); break;
      case 'intro': G.live.phase = 'intro'; commit(); break;
      case 'final': hostFinal(); break;
      case 'ddShow': hostShowDDClue(); break;
      case 'jesterShow': hostShowJester(); break;
      case 'reveal': hostReveal(); break;
      case 'close': hostClose(false); break;
      case 'keep': hostClose(true); break;
      case 'timer': hostTimer(+d.s); break;
      case 'stopTimer': RT.timer = null; commit(); break;
      case 'media': hostMedia(d.side, i, d.a); break;
      case 'buzz': hostToggleBuzzers(); break;
      case 'buzzReset': { const was = !!RT.buzz.openedAt; resetBuzz(was); commit(); break; }
      case 'addBuzzer': { const f = RT.buzz.order[0]; if (f && playerByPid(f.pid) < 0 && addPlayer(f.name, f.pid)) commit(); break; }
      case 'award': hostAward(i, +d.s); break;
      case 'undo': hostUndo(); break;
      case 'randomPick': hostRandomPicker(); break;
      case 'testPlayer': {
        const used = new Set(G.live.players.map(p => p.name)); let n = 1; while (used.has('Test player ' + n)) n++;
        const w = window.open(joinUrl() + '&name=' + encodeURIComponent('Test player ' + n) + '&test=1', '_blank');
        if (!w) flashMsg('The browser blocked the new tab. Allow pop-ups for this site.');
        break;
      }
      case 'rmTests': { const L = G.live; L.players = L.players.filter(p => !p.test); if (!L.players.some(p => p.id === L.picker)) L.picker = null; RT.selPlayer = -1; commit(); break; }
      case 'addPlayer': { const p = addPlayer(); commit(); if (p) { const n = $$('#hpanel .pname').pop(); if (n) { n.focus(); n.select(); } } return; }
      case 'rmPlayer': { const p = G.live.players[i]; if (p && confirm(`Remove ${p.name} from the scores?`)) { G.live.players.splice(i, 1); if (G.live.picker === p.id) G.live.picker = null; RT.selPlayer = -1; commit(); } break; }
      case 'resetBoard': if (confirm('Put every clue back on the board?')) { G.cats.forEach(c => c.cells.forEach(x => { x.played = false; })); G.live.open = null; RT.timer = null; resetBuzz(false); commit(); } break;
      case 'resetScores': if (confirm('Set every score back to 0?')) { G.live.players.forEach(p => { p.score = 0; }); G.live.history = []; commit(); } break;
      case 'newCode': if (confirm('Make a new room code? People who already joined will need the new invite link.')) newRoomCode(); break;
    }
    if (b.isConnected) b.blur();
  });
  pane.addEventListener('input', e => {
    const t = e.target, p = G.live.players[+t.dataset.i];
    if (t.dataset.input === 'pname' && p) { p.name = t.value.slice(0, 28); saveSoon(); broadcastSoon(); }
    else if (t.dataset.input === 'pscore' && p) { const v = parseInt(t.value, 10); if (!isNaN(v)) { p.score = v; saveSoon(); broadcastSoon(); } }
    else if (t.dataset.input === 'wager' && G.live.open) { G.live.open.wager = t.value === '' ? null : +t.value; saveSoon(); }
  });
  pane.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.setting) {
      G.settings[t.dataset.setting] = t.checked;
      if (t.dataset.setting === 'buzzers') resetBuzz(false);
      if (t.dataset.setting === 'chat') renderHostChat();
      t.blur(); commit();
    } else if (t.hasAttribute('data-hostsound')) { RT.hostSound = t.checked; updateHostAudio(); t.blur(); }
    else if (t.dataset.input === 'picker') { setPicker(t.value, true); t.blur(); }
  });
  pane.addEventListener('focusout', () => setTimeout(() => { if (RT.panelDirty) renderHostPanel(); }, 0));
  pane.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset.input && e.target.tagName === 'INPUT') e.target.blur(); });
}

document.addEventListener('keydown', e => {
  if (UI.mode !== 'host' || !G || $('.modal-bg') || UI.menu) return;
  const t = e.target, tag = t.tagName;
  if ((tag === 'INPUT' && !['checkbox', 'radio', 'button'].includes(t.type)) || tag === 'TEXTAREA' || tag === 'SELECT' || t.isContentEditable) return;
  if (e.ctrlKey || e.metaKey) return;
  const L = G.live, o = L.open, k = e.key;
  if (k === ' ' || k === 'Spacebar') {
    e.preventDefault();
    if (L.phase === 'intro') { L.phase = 'board'; commit(); }
    else if (!o) { if (RT.sel && L.phase === 'board') hostOpenTile(RT.sel.c, RT.sel.r); }
    else if (o.phase === 'dd') hostShowDDClue();
    else if (o.phase === 'jester') hostShowJester();
    else if (!o.revealed) hostReveal();
    else hostClose(false);
  } else if (k === 'Enter') {
    if (!o && L.phase === 'board' && RT.sel) { e.preventDefault(); hostOpenTile(RT.sel.c, RT.sel.r); }
  } else if (k === 'Escape') {
    if (RT.selPlayer >= 0) { RT.selPlayer = -1; renderHostPanel(); } else if (o) hostClose(false);
  } else if ((k === 'b' || k === 'B') && !e.altKey) { hostToggleBuzzers(); }
  else if ((k === 'y' || k === 'Y') && !e.altKey) { judgeFirst(1); }
  else if ((k === 'n' || k === 'N') && !e.altKey) { judgeFirst(-1); }
  else if (/^[1-9]$/.test(k) && !e.altKey) {
    const i = +k - 1; if (L.players[i]) { RT.selPlayer = RT.selPlayer === i ? -1 : i; renderHostPanel(); }
  } else if (k === 'ArrowUp' || k === 'ArrowDown') {
    e.preventDefault();
    if (RT.selPlayer >= 0 && L.players[RT.selPlayer]) hostAward(RT.selPlayer, k === 'ArrowUp' ? 1 : -1);
    else if (!o && L.phase === 'board') moveSel(0, k === 'ArrowUp' ? -1 : 1);
  } else if ((k === 'ArrowLeft' || k === 'ArrowRight') && !o && L.phase === 'board') {
    e.preventDefault(); moveSel(k === 'ArrowLeft' ? -1 : 1, 0);
  } else if (e.altKey && (e.code === 'KeyA' || k === 'a' || k === 'A')) {
    e.preventDefault(); G.settings.autoplay = !G.settings.autoplay; commit(); flashMsg(G.settings.autoplay ? 'Media plays when a clue opens' : 'Media waits for you to press play');
  }
});

/* ---------- connections (host side) ---------- */
function setNet(status, note) { Net.status = status; Net.note = note || ''; renderHostPanel(); broadcast(); }
function startLocal() {
  if (Net.bc || !('BroadcastChannel' in window)) return;
  Net.bc = new BroadcastChannel(BC_NAME);
  Net.bc.onmessage = e => onScreenMsg(e.data, { local: true });
}
async function startRemote() {
  if (Net.peer || Net.starting) return;
  Net.starting = true;
  setNet('connecting', '');
  try { await loadPeerJS(); }
  catch (e) { Net.starting = false; setNet('error', 'Invite links aren\u2019t available (the connection library didn\u2019t load). You can still screen-share the display tab.'); return; }
  Net.starting = false;
  let tries = 0;
  const go = () => {
    const peer = new window.Peer(PEER_PREFIX + Net.code, { debug: 1 });
    Net.peer = peer;
    peer.on('open', () => { if (Net.peer === peer) { tries = 0; setNet('online', ''); } });
    peer.on('connection', conn => { if (Net.peer === peer) setupConn(conn); });
    peer.on('disconnected', () => {
      if (Net.peer !== peer) return;
      setNet('connecting', 'Reconnecting\u2026');
      setTimeout(() => { if (Net.peer === peer && !peer.destroyed && peer.disconnected) { try { peer.reconnect(); } catch (e) {} } }, 2000);
    });
    peer.on('error', err => {
      if (Net.peer !== peer) return;
      const t = err && err.type;
      if (t === 'unavailable-id') {
        try { peer.destroy(); } catch (e) {}
        Net.peer = null;
        if (++tries <= 6) { setNet('connecting', 'Room code busy, trying again\u2026'); setTimeout(go, 2500); }
        else setNet('error', 'This room code is open in another tab. Close it or make a new room code.');
      } else if (t === 'browser-incompatible') setNet('error', 'This browser can\u2019t host invite links. Use Chrome or Edge.');
      else if (['network', 'server-error', 'socket-error', 'socket-closed'].includes(t)) {
        setNet('connecting', 'Connection dropped, trying again\u2026');
        setTimeout(() => { if (Net.peer === peer && !peer.destroyed && peer.disconnected) { try { peer.reconnect(); } catch (e) {} } }, 3000);
      }
    });
  };
  go();
}
function setupConn(conn) {
  const md = conn.metadata || {};
  const rec = { conn, name: String(md.name || 'Guest').slice(0, 28), pid: String(md.pid || '').slice(0, 40), test: !!md.test };
  conn.on('open', () => {
    Net.conns.set(conn.connectionId, rec);
    syncTo(m => safeSend(conn, m), true);
    onScreenMsg({ t: 'hello', name: rec.name, pid: rec.pid, test: rec.test }, { rec });
  });
  conn.on('data', d => onScreenMsg(d, { rec }));
  const gone = () => { if (Net.conns.delete(conn.connectionId)) renderHostPanel(); };
  conn.on('close', gone);
  conn.on('error', gone);
}
function newRoomCode() {
  if (Net.peer) { try { Net.peer.destroy(); } catch (e) {} Net.peer = null; }
  Net.conns.clear();
  Net.code = randCode(); lsSet('tn.room', Net.code);
  startRemote();
  renderHostPanel();
}
function onScreenMsg(m, from) {
  if (!m || typeof m !== 'object') return;
  if (from.local) {
    const id = String(m.id || 'display');
    if (m.t === 'hello') {
      const had = Net.locals.size; Net.locals.set(id, Date.now());
      if (!had) { RT.hostSound = false; updateHostAudio(); }
      syncTo(x => { try { Net.bc.postMessage(x); } catch (e) {} });
      renderHostPanel();
    } else if (m.t === 'ping') Net.locals.set(id, Date.now());
    else if (m.t === 'bye') {
      Net.locals.delete(id);
      if (!Net.locals.size) { RT.hostSound = true; updateHostAudio(); }
      renderHostPanel();
    }
    return;
  }
  const rec = from.rec; if (!rec) return;
  if (m.t === 'hello') {
    rec.name = String(m.name || rec.name || 'Guest').trim().slice(0, 28) || 'Guest';
    rec.pid = String(m.pid || rec.pid || '').slice(0, 40);
    if (UI.mode === 'host' && G && G.settings.autoAdd && rec.pid) {
      rec.test = rec.test || !!m.test;
      const L = G.live, nm = rec.name.toLowerCase();
      const online = pid => Array.from(Net.conns.values()).some(r => r !== rec && r.pid === pid);
      const p = L.players.find(x => x.pid === rec.pid) || L.players.find(x => x.name.trim().toLowerCase() === nm && (!x.pid || !online(x.pid)));
      if (p) { if (p.pid !== rec.pid) { p.pid = rec.pid; commit(); } else renderHostPanel(); }
      else if (addPlayer(rec.name, rec.pid, rec.test)) commit();
      else renderHostPanel();
    } else renderHostPanel();
  } else if (m.t === 'buzz') hostBuzz(rec.pid, rec.name);
  else if (m.t === 'pick') hostPickRequest(rec.pid, +m.c, +m.r);
  else if (m.t === 'chat') {
    if (!G || !G.settings.chat) return;
    const now = Date.now(); if (now - (rec.lastChat || 0) < 700) return; rec.lastChat = now;
    const text = String(m.text || '').trim().slice(0, 300); if (!text) return;
    const pl = G.live.players[playerByPid(rec.pid)];
    chatPush({ id: uid(), name: (pl && pl.name) || rec.name || 'Guest', text, t: now, host: false, pid: rec.pid || null });
  }
}

  $('#app').innerHTML = `<div class="viewer"><div class="screen-host" id="scr"></div>

    <div class="cover" id="cover"><button class="btn primary big" id="startBtn">Start the display</button><p>Click once so videos and sounds can play. Then screen-share this tab, or drag it to the screen everyone watches. Answers never show here until you reveal them.</p></div></div>`;
  const scr = createScreen($('#scr'), { waitText: 'Waiting for the host tab' });
  $('#fsBtn').onclick = toggleFullscreen;

  if (!('BroadcastChannel' in window)) { scr.setWait('This browser can\u2019t run the display tab. Use Chrome, Edge or Firefox.'); return; }
  const id = uid(), bc = new BroadcastChannel(BC_NAME);
  bc.onmessage = e => { const m = e.data; if (m && ['state', 'clue', 'answer', 'media', 'fx'].includes(m.t)) scr.handle(m); };
  const hello = () => bc.postMessage({ t: 'hello', id });

  addEventListener('pagehide', () => { try { bc.postMessage({ t: 'bye', id }); } catch (e) {} });
  $('#startBtn').onclick = () => { SFX.unlock(); $('#cover').remove(); hello(); };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => scr.refit());
}

    <div class="screen-host" id="scr"></div>
    <div class="pbar">
      <div class="pb-side"><span class="pill" id="pst"><i class="dot"></i><span>Connecting</span></span></div>
      <div class="pb-center"><button class="buzzbtn idle" id="buzz" disabled>Buzz</button><div class="pbar-note" id="bnote"></div></div>
      <div class="pb-side right"><button class="pill" id="chatBtn">${icon('chat', 16)}Chat<b class="unread hidden" id="unread"></b></button><button class="pill" id="muteBtn" title="Mute" aria-label="Mute"></button><button class="pill" id="fsBtn" title="Full screen" aria-label="Full screen">${icon('full', 16)}</button></div>
    </div>
  </div>
  <aside class="chat" id="chat" aria-label="Chat">
    <div class="chat-head"><b>Chat</b><button class="btn sm icon ghost" id="chatClose" title="Close chat" aria-label="Close chat">${icon('x', 16)}</button></div>
    <div class="chat-log" id="chatLog" aria-live="polite"></div>
    <form class="chat-form" id="chatForm"><input class="txt" id="chatIn" maxlength="300" placeholder="Say something" autocomplete="off"><button class="btn sm primary" type="submit">Send</button></form>
  </aside>
</div>`;
  const buzz = $('#buzz'), bnote = $('#bnote'), pst = $('#pst'), chat = $('#chat'), chatLog = $('#chatLog'), unreadEl = $('#unread');
  let muted = !!lsGet('tn.mute', false), conn = null, last = 0, retryT = 0, S = null, unread = 0, buzzedKey = null;
  let chatOpen = lsGet('tn.chatOpen', innerWidth >= 1000);
  const scr = createScreen($('#scr'), { waitText: 'Connecting to the host', muted, onState: st => { S = st; update(); }, onTile: (c, r) => safeSend(conn, { t: 'pick', c, r }) });
  const setSt = (kind, text) => { pst.className = 'pill ' + kind; $('span', pst).textContent = text; if (!S) scr.setWait(text); };
  const setMuteIcon = () => { $('#muteBtn').innerHTML = icon(muted ? 'mute' : 'vol', 16); };
  const showChat = v => {
    chatOpen = v; lsSet('tn.chatOpen', v);
    chat.classList.toggle('hidden', !v || (S && S.chat === false));
    if (v) { unread = 0; unreadEl.classList.add('hidden'); chatLog.scrollTop = chatLog.scrollHeight; }
  };
  setMuteIcon(); showChat(chatOpen);
  $('#muteBtn').onclick = () => { muted = !muted; lsSet('tn.mute', muted); scr.setMuted(muted); setMuteIcon(); };
  $('#fsBtn').onclick = toggleFullscreen;
  $('#chatBtn').onclick = () => showChat(!chatOpen);
  $('#chatClose').onclick = () => showChat(false);
  $('#chatForm').onsubmit = e => { e.preventDefault(); const i = $('#chatIn'), t = i.value.trim(); if (t) { safeSend(conn, { t: 'chat', text: t.slice(0, 300) }); i.value = ''; } };

  function addMsg(m, quiet) {
    const d = document.createElement('div');
    d.className = 'cmsg' + (m.host ? ' host' : '') + (m.sys ? ' sys' : '') + (m.pid && m.pid === pid ? ' me' : '');
    d.innerHTML = m.sys ? `<span>${esc(m.text)}</span>` : `<b>${esc(m.name || 'Guest')}</b><span>${richText(m.text)}</span>`;
    const stick = chatLog.scrollTop + chatLog.clientHeight >= chatLog.scrollHeight - 40;
    chatLog.appendChild(d);
    while (chatLog.children.length > 150) chatLog.firstChild.remove();
    if (stick || (m.pid && m.pid === pid)) chatLog.scrollTop = chatLog.scrollHeight;
    if (!quiet && !chatOpen && !m.sys) { unread++; unreadEl.textContent = unread > 9 ? '9+' : String(unread); unreadEl.classList.remove('hidden'); }
  }

  function update() {
    if (!S) return;
    $('#chatBtn').classList.toggle('hidden', S.chat === false);
    chat.classList.toggle('hidden', !chatOpen || S.chat === false);
    const me = S.players.find(p => p.pid === pid), picker = S.players.find(p => p.id === S.picker);
    const o = S.phase === 'board' ? S.open : null, b = S.buzz || {};
    const myPick = !!(me && picker && me.id === picker.id && S.pick && S.phase === 'board' && !o);
    scr.setPickable(myPick);
    const inClue = !!(o && o.phase === 'clue' && !o.revealed && !o.dd);
    const order = b.order || [], idx = order.findIndex(x => x.pid === pid);
    const early = (b.early || []).some(x => x.pid === pid), out = (b.out || []).includes(pid);
    let label = 'Buzz', cls = 'idle', enabled = false, note;
    if (o && o.phase === 'jester') note = 'Jester! A surprise mini-game is coming.';
    else if (o && o.dd && !o.revealed) note = picker && me && picker.id === me.id ? 'Daily Double! Only you answer this one.' : `Daily Double: only ${picker ? picker.name : 'the picker'} answers`;
    else if (!inClue) note = myPick ? 'Your pick! Tap a tile on the board.' : picker && S.phase === 'board' && !o ? `${picker.name} is picking` : 'Wait for the next clue';
    else if (!b.on) note = 'Answer out loud when the host asks';
    else if (early) { label = 'Locked'; cls = 'out'; note = 'Too early! You\u2019re locked out of this one.'; }
    else if (out) { label = 'Locked'; cls = 'out'; note = 'You already answered this one'; }
    else if (idx === 0) { label = 'You\u2019re first'; cls = 'first'; note = 'Answer now!'; }
    else if (idx > 0) { label = `#${idx + 1}`; cls = 'queued'; note = `You\u2019re number ${idx + 1} in line`; }
    else if (!b.armed) { label = 'Wait'; cls = 'wait'; enabled = true; note = b.opened ? 'Buzzers are locked' : 'Wait for the host to open buzzers. Buzzing early locks you out.'; }
    else { label = 'Buzz!'; cls = 'go'; enabled = true; note = 'Buzz now! (Space)'; }
    if (inClue && buzzedKey === o.key + ':' + (b.opened ? 1 : 0) && idx < 0 && !out) { enabled = false; note = 'Buzzed\u2026'; }
    buzz.textContent = label; buzz.className = 'buzzbtn ' + cls; buzz.disabled = !enabled;
    buzz.classList.toggle('hidden', !b.on);
    bnote.textContent = note;
  }
  const doBuzz = () => {
    if (buzz.disabled || !S || !S.open) return;
    safeSend(conn, { t: 'buzz', pid });
    buzzedKey = S.open.key + ':' + (S.buzz && S.buzz.opened ? 1 : 0);
    buzz.disabled = true; bnote.textContent = 'Buzzed\u2026';
  };
  buzz.onclick = doBuzz;
  addEventListener('keydown', e => { if (e.code === 'Space' && !e.repeat && !/INPUT|TEXTAREA|SELECT|BUTTON/.test(e.target.tagName)) { e.preventDefault(); doBuzz(); } });

  setSt('', 'Connecting');
  loadPeerJS().then(() => {
    const peer = new window.Peer({ debug: 1 });
    const retry = ms => { if (retryT) return; retryT = setTimeout(() => { retryT = 0; connect(); }, ms); };
    function connect() {
      if (peer.destroyed) return;
      if (peer.disconnected) { try { peer.reconnect(); } catch (e) {} retry(2500); return; }
      if (conn) { try { conn.close(); } catch (e) {} }
      const c = peer.connect(PEER_PREFIX + code, { reliable: true, metadata: { name, pid, test: !!test } });
      conn = c;
      const to = setTimeout(() => { if (conn === c && !c.open) { try { c.close(); } catch (e) {} retry(1500); } }, 15000);
      c.on('open', () => { clearTimeout(to); last = Date.now(); setSt('ok', 'Live'); safeSend(c, { t: 'hello', name, pid, test: !!test }); });
      c.on('data', d => {
        last = Date.now();
        if (!d || typeof d !== 'object') return;
        if (d.t === 'chat' && d.m) addMsg(d.m);
        else if (d.t === 'chatlog' && Array.isArray(d.list)) { chatLog.innerHTML = ''; d.list.forEach(m => addMsg(m, true)); chatLog.scrollTop = chatLog.scrollHeight; }
        else scr.handle(d);
      });
      c.on('close', () => { if (conn === c) { setSt('', 'Reconnecting'); retry(2500); } });
      c.on('error', () => { if (conn === c) retry(2500); });
    }
    peer.on('open', connect);
    peer.on('error', err => {
      const t = err && err.type;
      if (t === 'peer-unavailable') { setSt('', 'Waiting for the host to start'); retry(4000); }
      else if (t === 'browser-incompatible') setSt('bad', 'This browser can\u2019t join. Try Chrome, Edge, Firefox or Safari.');
      else { setSt('', 'Reconnecting'); retry(4000); }
    });
    peer.on('disconnected', () => setTimeout(() => { if (!peer.destroyed && peer.disconnected) { try { peer.reconnect(); } catch (e) {} } }, 2000));
    setInterval(() => { if (conn && conn.open && Date.now() - last > 20000) { try { conn.close(); } catch (e) {} setSt('', 'Reconnecting'); retry(500); } }, 4000);
  }).catch(() => setSt('bad', 'Couldn\u2019t connect. Check your internet and reload the page.'));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => scr.refit());
}

/* ---------- start ---------- */
async function boot() {
  const qs = new URLSearchParams(location.search);
  if (qs.get('join')) return bootJoin(qs.get('join'), qs.get('name'), qs.has('test'));
  if (qs.has('display')) return bootDisplay();
  await loadAll();
  document.addEventListener('pointerdown', () => SFX.unlock(), { once: true });
  addEventListener('pagehide', () => { if (G) persist(G).catch(() => {}); });
  addEventListener('hashchange', async () => { if (await addFromHash() && UI.mode !== 'host') renderHome(); });
  if (await addFromHash()) { renderHome(); return; }
  const mode = lsGet('tn.mode', 'home');
  if (mode === 'host' && G.cats.some(c => c.cells.some(cellFilled))) enterHost({ silent: true });
  else if (mode === 'edit') renderEditor();
  else renderHome();
}
boot().catch(err => {
  console.error(err);
  $('#app').innerHTML = `<div class="boot">Something went wrong while loading: ${esc(err && err.message || err)}</div>`;
});
})();

</script>
</body>
</html>
